[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveslice"
version = "0.1.0"
description = "WaveSlice: fairness-aware scheduling for vLLM LoRA serving."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
]

[project.optional-dependencies]
vllm = ["vllm"]
dev = ["pytest>=7", "ruff>=0.8"]

[project.entry-points."vllm.general_plugins"]
waveslice = "waveslice.plugin:register"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["waveslice*"]

[tool.setuptools.package-data]
"waveslice.data.lut_tables" = ["*.json", "ablation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402", "E501", "UP038"]

[tool.ruff.lint.isort]
combine-as-imports = true
